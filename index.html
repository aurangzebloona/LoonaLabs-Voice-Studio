<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoonaLabs - Professional Voice Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --danger: #ef4444;
            --success: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .logo-img {
            height: 50px;
            width: auto;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .header p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-top: 5px;
        }

        .main-container {
            background: var(--card-bg);
            width: 100%;
            max-width: 800px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
            padding: 30px;
            border: 1px solid var(--border-color);
        }

        .input-section { margin-bottom: 20px; }
        .input-section label { display: block; font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        
        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            font-size: 1rem;
            resize: vertical;
            transition: all 0.3s ease;
            line-height: 1.5;
        }
        textarea:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1); }

        .word-counter { text-align: right; font-size: 0.85rem; color: var(--text-muted); margin-top: 8px; font-weight: 600; }
        .word-counter.limit-reached { color: var(--danger); }

        .controls-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 25px;
            background: #f1f5f9;
            padding: 20px;
            border-radius: 12px;
        }

        .control-group { display: flex; flex-direction: column; gap: 8px; }
        .control-group label { font-size: 0.9rem; font-weight: 600; color: var(--text-main); }

        select {
            width: 100%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: white;
            cursor: pointer;
            font-size: 0.95rem;
        }
        select:focus { outline: none; border-color: var(--primary); }

        .action-buttons { display: flex; gap: 15px; flex-wrap: wrap; }
        
        button.action-btn {
            flex: 1;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-generate { background: var(--primary); color: white; }
        .btn-generate:hover { background: var(--primary-hover); transform: translateY(-2px); }
        .btn-generate:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
        
        .btn-play { background: var(--success); color: white; display: none; }
        .btn-play:hover { background: #059669; }
        
        .btn-download { background: #0f172a; color: white; display: none; }
        .btn-download:hover { background: #334155; transform: translateY(-2px); }

        /* Loader Animation */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        audio { display: none; } /* Hidden Audio Player */

        @media (max-width: 600px) {
            .action-buttons { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-container">
            <img src="logo.jpg" alt="LoonaLabs Logo" class="logo-img" onerror="this.style.display='none'">
            <h1>LoonaLabs</h1>
        </div>
        <p>Professional Text-to-Speech Studio</p>
    </div>

    <div class="main-container">
        
        <div class="input-section">
            <label for="text-input">Enter your text here:</label>
            <textarea id="text-input" placeholder="Type or paste your text here (up to 4000 words)..."></textarea>
            <div class="word-counter" id="word-count">0 / 4000 Words</div>
        </div>

        <div class="controls-grid">
            <div class="control-group">
                <label><i class="fas fa-user-circle"></i> Select Professional Voice</label>
                <select id="voice-select">
                    <option value="en-us|John">John — English (USA) — Male</option>
                    <option value="en-us|Linda">Linda — English (USA) — Female</option>
                    <option value="en-gb|Harry">Harry — English (UK) — Male</option>
                    <option value="en-gb|Alice">Alice — English (UK) — Female</option>
                    <option value="en-in|Harry">Harry — English (India) — Male</option>
                    <option value="en-in|Raveena">Raveena — English (India) — Female</option>
                    <option value="hi-in|Kabir">Kabir — Hindi / Urdu — Male</option>
                    <option value="hi-in|Puja">Puja — Hindi / Urdu — Female</option>
                    <option value="ar-sa|Salim">Salim — Arabic (Saudi Arabia) — Male</option>
                    <option value="ar-sa|Oda">Oda — Arabic (Saudi Arabia) — Female</option>
                </select>
            </div>
        </div>

        <div class="action-buttons">
            <button class="action-btn btn-generate" id="generate-btn">
                <div class="spinner" id="spinner"></div>
                <span id="btn-text"><i class="fas fa-magic"></i> Generate Audio</span>
            </button>
            <button class="action-btn btn-play" id="play-btn"><i class="fas fa-play"></i> Play Audio</button>
            <a id="download-link" style="display: none; flex: 1;">
                <button class="action-btn btn-download" id="download-btn" style="width: 100%;"><i class="fas fa-download"></i> Download MP3</button>
            </a>
        </div>

        <!-- Hidden Audio Element -->
        <audio id="audio-player"></audio>
    </div>

    <script>
        // آپ کی دی گئی پکی API Key
        const API_KEY = "f92f0d3524064f6b83e88274979fb105"; 
        
        const textInput = document.getElementById('text-input');
        const wordCountDisplay = document.getElementById('word-count');
        const generateBtn = document.getElementById('generate-btn');
        const playBtn = document.getElementById('play-btn');
        const downloadLink = document.getElementById('download-link');
        const downloadBtn = document.getElementById('download-btn');
        const voiceSelect = document.getElementById('voice-select');
        const audioPlayer = document.getElementById('audio-player');
        const spinner = document.getElementById('spinner');
        const btnText = document.getElementById('btn-text');
        
        let audioBlobUrl = null;

        // ===== سخت ری سیٹ سسٹم (Strict UI Reset) =====
        function strictUIReset() {
            // 1. بٹنوں کو غائب کریں
            playBtn.style.display = 'none';
            downloadLink.style.display = 'none';
            
            // 2. جنریٹ بٹن کا ٹیکسٹ واپس اصلی حالت میں لائیں
            btnText.innerHTML = '<i class="fas fa-magic"></i> Generate Audio';
            
            // 3. اگر پرانی آڈیو پلے ہو رہی ہے تو اسے روکیں اور پکی ڈیلیٹ کریں
            audioPlayer.pause();
            audioPlayer.currentTime = 0;
            audioPlayer.src = ""; 
            
            // 4. پرانی ڈاؤن لوڈ فائل کا لنک بھی اڑا دیں تاکہ وہ غلطی سے بھی ڈاؤن لوڈ نہ ہو
            downloadLink.href = "";
            downloadLink.removeAttribute("download");
        }

        // جب یوزر ٹیکسٹ باکس میں کچھ بھی لکھے، مٹائے یا پیسٹ کرے
        textInput.addEventListener('input', () => {
            let text = textInput.value.trim();
            let words = text === "" ? 0 : text.split(/\s+/).length;
            wordCountDisplay.textContent = `${words} / 4000 Words`;

            // پرانی آڈیو اور بٹن فوراً غائب کر دے گا
            strictUIReset();

            // الفاظ کی لمٹ چیک
            if (words > 4000) {
                wordCountDisplay.classList.add('limit-reached');
                textInput.style.borderColor = 'var(--danger)';
                generateBtn.disabled = true;
            } else {
                wordCountDisplay.classList.remove('limit-reached');
                textInput.style.borderColor = 'var(--border-color)';
                generateBtn.disabled = false;
            }
        });

        // نیا فیچر: اگر یوزر نئی آواز (Voice) سلیکٹ کرے تو بھی پرانی آڈیو غائب ہو جائے
        voiceSelect.addEventListener('change', () => {
            strictUIReset();
        });

        // Generate Audio Logic
        generateBtn.addEventListener('click', async () => {
            let text = textInput.value.trim();
            let words = text === "" ? 0 : text.split(/\s+/).length;

            if (text === '') { alert('Please enter some text first!'); return; }
            if (words > 4000) { alert('Limit exceeded! Keep your text under 4000 words.'); return; }

            // Get selected language and voice name
            const [lang, voiceName] = voiceSelect.value.split('|');

            // UI Changes - Loading State
            generateBtn.disabled = true;
            spinner.style.display = 'block';
            btnText.textContent = ' Processing MP3...';
            playBtn.style.display = 'none';
            downloadLink.style.display = 'none';

            // API Request
            try {
                const response = await fetch('https://api.voicerss.org/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: `key=${API_KEY}&hl=${lang}&v=${voiceName}&c=MP3&f=44khz_16bit_stereo&src=${encodeURIComponent(text)}`
                });

                if (!response.ok) throw new Error('API Request Failed');

                const blob = await response.blob();
                
                // Catch API Error messages
                if (blob.type === "text/html" || blob.size < 1000) {
                    const textError = await blob.text();
                    alert("API Error: " + textError);
                    resetUI();
                    return;
                }

                // Success
                if (audioBlobUrl) URL.revokeObjectURL(audioBlobUrl);
                audioBlobUrl = URL.createObjectURL(blob);
                
                audioPlayer.src = audioBlobUrl;
                downloadLink.href = audioBlobUrl;
                downloadLink.download = "LoonaLabs_Voiceover.mp3";
                
                // Show Play & Download
                spinner.style.display = 'none';
                btnText.innerHTML = '<i class="fas fa-check"></i> Audio Ready!';
                playBtn.style.display = 'flex';
                downloadLink.style.display = 'flex';
                downloadBtn.style.display = 'flex';
                generateBtn.disabled = false;

            } catch (error) {
                alert('Error generating audio. Please check your internet connection.');
                resetUI();
            }
        });

        // Play / Pause Logic
        playBtn.addEventListener('click', () => {
            if (audioPlayer.paused) {
                audioPlayer.play();
                playBtn.innerHTML = '<i class="fas fa-pause"></i> Pause Audio';
                playBtn.style.backgroundColor = '#d97706'; 
            } else {
                audioPlayer.pause();
                playBtn.innerHTML = '<i class="fas fa-play"></i> Play Audio';
                playBtn.style.backgroundColor = 'var(--success)';
            }
        });

        // Reset play button when audio ends
        audioPlayer.addEventListener('ended', () => {
            playBtn.innerHTML = '<i class="fas fa-play"></i> Play Audio';
            playBtn.style.backgroundColor = 'var(--success)';
        });

        function resetUI() {
            spinner.style.display = 'none';
            btnText.innerHTML = '<i class="fas fa-magic"></i> Generate Audio';
            generateBtn.disabled = false;
        }
    </script>
</body>
</html>
